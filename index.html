<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descarga tu archivo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            font-size: 16px;
        }
        .btn-descarga {
            display: inline-block;
            background-color: #007BFF;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 18px;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-descarga:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Bienvenido a mi sitio web</h1>
    <p>Haz clic en el botón de abajo para comenzar la descarga directa:</p>
    
    <!-- El enlace ya incluye tu ID de Google Drive configurado para descarga directa -->
    <a href="https://google.com" class="btn-descarga">
        📥 Descargar Archivo
    </a>

</body>
</html>
